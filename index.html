<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CISI Revision Hub — Regulation · Securities · Derivatives</title>
<meta name="theme-color" content="#0c0e13" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CISI Revision" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />
<script>
  // Set theme before paint to avoid a flash of the wrong theme
  (function(){
    try{
      var saved = localStorage.getItem("cisi_theme");
      var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light");
      document.documentElement.setAttribute("data-theme", theme);
    }catch(e){}
  })();
</script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <div class="layout" id="layout">
    <main class="main" id="app"></main>
  </div>

  <!-- Data bundles (loaded as plain scripts so this works when opened directly as a local file) -->
  <script src="data/regulation.js"></script>
  <script src="data/securities.js"></script>
  <script src="data/derivatives.js"></script>
  <script src="app.js"></script>
  <script>
    // Service worker only makes sense (and only registers) once this is served over http(s),
    // eg after publishing to GitHub Pages — it silently no-ops when opened as a local file://.
    if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
      window.addEventListener("load", function(){
        navigator.serviceWorker.register("sw.js").catch(function(){});
      });
    }
  </script>
</body>
</html>
